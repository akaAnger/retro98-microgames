<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ничего Полезного — Retro '98 (Launcher)</title>
<style>
  :root{ --bg:#c0c0c0; --win:#d4d0c8; --dark:#404040; --mid:#808080; --light:#fff; --text:#111; }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 "MS Sans Serif",Tahoma,Verdana,Arial,sans-serif}
  .window{max-width:1080px;margin:20px auto;background:var(--win);
    border:2px solid var(--dark);border-right-color:var(--light);border-bottom-color:var(--light);box-shadow:0 0 0 1px var(--mid) inset}
  .title{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:3px 6px;color:#fff;background:linear-gradient(#000080,#1084d0)}
  .title b{font-size:13px}
  .menubar{display:flex;gap:12px;align-items:center;padding:6px 8px;color:#000;border-top:1px solid var(--light);border-bottom:1px solid var(--mid);background:linear-gradient(#efefef,#e3e3e3)}
  .layout{display:grid;grid-template-columns:260px 1fr;gap:0}
  /* left menu */
  .sidebar{border-right:1px solid var(--mid);background:#efefef;min-height:540px}
  .list{padding:6px}
  .item{display:flex;align-items:center;gap:8px;width:100%;padding:6px;border:1px solid var(--mid);background:#f6f4ef;margin-bottom:6px;cursor:pointer;
        color:inherit;font:inherit;text-align:left;box-shadow:inset -1px -1px 0 var(--light), inset 1px 1px 0 var(--dark)}
  .item:hover{background:#fff}
  .item:focus-visible{outline:2px solid #000;outline-offset:2px}
  .item.active{outline:2px solid #000080;outline-offset:-2px}
  /* right viewer */
  .viewer{position:relative;min-height:540px;background:#f3f1ec}
  .frameWrap{position:relative;height:640px;border-top:1px solid var(--mid)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .status{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-top:1px solid var(--light);background:#efefef;color:#000}
  .btn{padding:4px 10px;background:var(--win);border:2px solid var(--light);border-right-color:var(--dark);border-bottom-color:var(--dark);cursor:pointer;text-decoration:none;color:inherit}
  .btn:active{border:2px solid var(--dark);border-right-color:var(--light);border-bottom-color:var(--light)}
  .hint{padding:6px 8px;color:#333}
</style>
</head>
<body>
  <div class="window">
    <div class="title">
      <b>Ничего Полезного — Retro '98</b>
      <div style="display:flex;gap:6px">
        <a class="btn" href="https://t.me/+8RBPhwcsKJI1NmUy" target="_blank" rel="noopener">Продолжить →</a>
      </div>
    </div>
    <div class="menubar">Файл &nbsp; Правка &nbsp; Вид &nbsp; Помощь</div>
    <div class="layout">
      <aside class="sidebar">
        <div class="hint">Выбери игру (загружается в правом окне):</div>
        <div id="list" class="list"></div>
      </aside>
      <section class="viewer">
        <div class="frameWrap">
          <iframe id="frame" title="Игровое окно" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </section>
    </div>
    <div class="status">
      <div>© 1998…2025 «Это не продакт, это настроение»</div>
      <div id="status">Готов</div>
    </div>
  </div>

<script>
(function(){
  const games = [
    { id:'password',  title:'Password Game 98',   file:'game/password98.html',  desc:'Эскалация правил' },
    { id:'stim',      title:'Stimulation 98',     file:'game/stimclicker98.html', desc:'Кликер‑перегрузка' },
    { id:'eye',       title:'Глазяка',            file:'game/eye98.html',       desc:'Следит за курсором' },
    { id:'dontpress', title:'НЕ НАЖИМАТЬ',        file:'game/dontpress98.html', desc:'Эскалация кнопки' },
    { id:'folder',    title:'Пляшущая папка',     file:'game/dancingfolder98.html', desc:'Танцы при приближении' }
  ];
  const list = document.getElementById('list');
  const frame = document.getElementById('frame');
  const status = document.getElementById('status');

  function renderList(){
    list.innerHTML='';
    games.forEach((g,i)=>{
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'item' + (i===0?' active':'');
      el.setAttribute('aria-pressed', i===0 ? 'true' : 'false');
      el.innerHTML = `<span aria-hidden="true">📝</span><div><b>${g.title}</b><div style="color:#333">${g.desc}</div></div>`;
      el.onclick = ()=>load(i, el);
      list.appendChild(el);
    });
  }

  function load(i, el){
    [...list.children].forEach(n=>{
      n.classList.remove('active');
      n.setAttribute('aria-pressed', 'false');
    });
    el.classList.add('active');
    el.setAttribute('aria-pressed', 'true');
    frame.src = games[i].file;
    status.textContent = 'Открыто: ' + games[i].title;
  }

  renderList();
  // auto-load first
  if(list.firstChild) list.firstChild.click();
})();
</script>
</body>
</html>
