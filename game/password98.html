<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Password Game 98</title>
<style>
  :root{ --bg:#c0c0c0; --win:#d4d0c8; --dark:#404040; --mid:#808080; --light:#fff; --text:#111; --ok:#006400; --bad:#8b0000; --blue:#000080; }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 "MS Sans Serif",Tahoma,Verdana,Arial,sans-serif}
  .window{max-width:720px;margin:12px auto;background:var(--win);border:2px solid var(--dark);
    border-right-color:var(--light);border-bottom-color:var(--light);box-shadow:0 0 0 1px var(--mid) inset}
  .title{padding:3px 6px;color:#fff;background:linear-gradient(#000080,#1084d0)}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px;border-top:1px solid var(--light);border-bottom:1px solid var(--mid);background:linear-gradient(#efefef,#e3e3e3)}
  .panel{padding:12px}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  input[type=password], input[type=text]{flex:1;padding:6px;border:2px solid var(--light);border-right-color:var(--dark);border-bottom-color:var(--dark);background:#fff}
  .help{color:#333}
  .btn{padding:4px 10px;background:var(--win);border:2px solid var(--light);border-right-color:var(--dark);border-bottom-color:var(--dark);cursor:pointer;text-decoration:none;color:inherit}
  .btn:active{border:2px solid var(--dark);border-right-color:var(--light);border-bottom-color:var(--light)}
  .progress{flex:1;min-width:160px;height:10px;background:#e5e5e5;border:1px solid var(--mid);box-shadow:inset -1px -1px 0 var(--light), inset 1px 1px 0 var(--dark)}
  .progress .bar{height:100%;width:0;background:var(--blue)}
  .progwrap{display:flex;align-items:center;gap:8px;min-width:220px}
  ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
  li{display:flex;gap:8px;align-items:flex-start;background:#eee;border:1px solid var(--mid);
     box-shadow:inset -1px -1px 0 var(--light), inset 1px 1px 0 var(--dark); padding:6px}
  .ok::before{content:"✔";color:var(--ok)}
  .bad::before{content:"✖";color:var(--bad)}
  .footer{display:flex;justify-content:space-between;align-items:center;padding:8px;border-top:1px solid var(--light);background:#efefef;gap:8px;flex-wrap:wrap}
  .stat{display:flex;gap:12px;align-items:center}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;border:1px solid var(--mid);padding:6px 10px;opacity:0;transition:.2s}
  .toast.show{opacity:1}
  .sr{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
  <div class="window">
    <div class="title"><b>Парольный ад — Retro '98</b></div>

    <div class="bar">
      <div class="progwrap" title="Прогресс по всем правилам">
        <div class="progress" aria-hidden="true"><div class="bar" id="progbar"></div></div>
        <b id="proglbl">0%</b>
      </div>

      <div class="stat">
        <div>Этап: <span id="stage">1</span>/<span id="stages">8</span></div>
        <div>Время: <span id="timer">00:00</span></div>
        <div>Рекорд: <span id="best">—</span></div>
      </div>

      <button id="toggle" class="btn" aria-pressed="false" title="Показать/скрыть пароль">Показать</button>
    </div>

    <div class="panel">
      <div class="row">
        <label for="p1" style="min-width:90px">Пароль:</label>
        <input id="p1" type="password" autocomplete="off" />
      </div>
      <div class="help">Собери все галочки. Выполнил пакет — получаешь новый.</div>
      <ul id="rules"></ul>
    </div>

    <div class="footer">
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="copy()">Скопировать</button>
        <button id="reset" class="btn">Сброс</button>
      </div>
      <div id="done" class="help"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">Скопировано</div>
  <div id="live" class="sr" aria-live="polite"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);

  const input = $('#p1');
  const list = $('#rules');
  const stageEl = $('#stage');
  const stagesEl = $('#stages');
  const progbar = $('#progbar');
  const proglbl = $('#proglbl');
  const toast = $('#toast');
  const toggleBtn = $('#toggle');
  const resetBtn = $('#reset');
  const timerEl = $('#timer');
  const bestEl = $('#best');
  const live = $('#live');
  const done = $('#done');

  // ===== ВСПОМОГАТЕЛЬНЫЕ =====
  const letterRe = /[A-Za-zА-Яа-яЁё]/;
  const digitRe  = /\d/;
  const vowelSet = new Set('аеёиоуыэюяaeiouyАЕЁИОУЫЭЮЯAEIOUY'.split(''));
  const LS_KEY = 'pw98_state_v2';

  const isLetter = ch => letterRe.test(ch);
  const isUpper  = ch => ch === ch.toUpperCase() && ch !== ch.toLowerCase();
  const isLower  = ch => ch === ch.toLowerCase() && ch !== ch.toUpperCase();
  const countChr = (s,ch) => (s.match(new RegExp(escapeRegExp(ch),'g'))||[]).length;
  const escapeRegExp = str => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  const isPrime = n => {
    if(n < 2) return false;
    for(let i=2;i*i<=n;i++) if(n%i===0) return false;
    return true;
  };

  // Зебра: буквы попеременно верх/низ регистра (игнорируя небуквы). Допускаются оба старта (Aa… или aA…)
  function zebraOK(s){
    const letters = [...s].filter(isLetter);
    if(letters.length < 2) return false;
    const check = startUpper => letters.every((ch,i)=> startUpper ? (i%2===0?isUpper(ch):isLower(ch)) : (i%2===0?isLower(ch):isUpper(ch)));
    return check(true) || check(false);
  }
  function lettersEven(s){ return [...s].filter(isLetter).length % 2 === 0; }
  function noTwoNonLettersInRow(s){
    const arr = [...s];
    for(let i=1;i<arr.length;i++){
      if(!isLetter(arr[i]) && !isLetter(arr[i-1])) return false;
    }
    return true;
  }
  function twoDistinctDigits(s){
    const ds = (s.match(/\d/g)||[]).map(Number);
    if(ds.length < 2) return false;
    return new Set(ds).size === 2;
  }
  function underscoresEqExclaims(s){ return countChr(s,'_') === countChr(s,'!'); }
  function palindromeLettersOnly(s){
    const letters = [...s].filter(isLetter).map(ch=>ch.toLowerCase());
    if(letters.length < 2) return false;
    const rev = [...letters].reverse();
    return letters.every((ch,i)=> ch === rev[i]);
  }
  function vowelsEqConsonants(s){
    const letters = [...s].filter(isLetter).map(ch=>ch);
    if(letters.length < 2) return false;
    let v=0;
    for(const ch of letters) if(vowelSet.has(ch)) v++;
    const c = letters.length - v;
    return v === c;
  }
  function noAscendingDigitRun3Plus(s){
    const arr = [...s];
    let runLen = 1;
    for(let i=1;i<arr.length;i++){
      if(digitRe.test(arr[i]) && digitRe.test(arr[i-1]) && (arr[i].charCodeAt(0) - arr[i-1].charCodeAt(0) === 1)){
        runLen++;
        if(runLen >= 3) return false;
      } else {
        runLen = 1;
      }
    }
    return true;
  }
  function categories3(s){
    let hasL=false, hasD=false, hasS=false;
    for(const ch of s){
      if(isLetter(ch)) hasL = true;
      else if(digitRe.test(ch)) hasD = true;
      else hasS = true;
    }
    return hasL && hasD && hasS;
  }
  const startsWithLetter = s => /^[A-Za-zА-Яа-яЁё]/.test(s);
  const uniqueAtLeast = (s,n) => new Set([...s]).size >= n;

  // ===== ПАКЕТЫ ПРАВИЛ (8 ЭТАПОВ) =====
  const packs = [
    // 1
    [
      {id:1, text:'Минимум 8 символов', ok: s => s.length>=8},
      {id:2, text:'Есть заглавная буква', ok: s => /[A-ZА-ЯЁ]/.test(s)},
      {id:3, text:'Есть строчная буква', ok: s => /[a-zа-яё]/.test(s)},
    ],
    // 2
    [
      {id:4, text:'Есть цифра', ok: s => /\d/.test(s)},
      {id:5, text:'Содержит «98»', ok: s => /98/.test(s)},
      {id:6, text:'Ровно один «_»', ok: s => (s.match(/_/g)||[]).length===1},
    ],
    // 3
    [
      {id:7, text:'Сумма всех цифр = 25', ok: s => [...s].map(c=>+c).filter(n=>!isNaN(n)).reduce((a,b)=>a+b,0)===25},
      {id:8, text:'Есть слово: ретро, винил или дискета', ok: s => /(ретро|винил|дискета)/i.test(s)},
      {id:9, text:'Без пробелов', ok: s => !/\s/.test(s)},
    ],
    // 4
    [
      {id:10, text:'Заканчивается на «!» или «?»', ok: s => /[!?]$/.test(s)},
      {id:11, text:'Нет трёх одинаковых символов подряд', ok: s => !/(.)\1\1/.test(s)},
      {id:12, text:'Содержит римскую букву (I,V,X,L,C,D,M)', ok: s => /[IVXLCDM]/.test(s)},
    ],
    // 5 — мемная «зебра»
    [
      {id:13, text:'Буквы идут зеброй: aA aA / Aa Aa (небуквы игнорируются)', ok: s => zebraOK(s)},
      {id:14, text:'Количество букв — чётное', ok: s => lettersEven(s)},
      {id:15, text:'Нет двух небукв подряд', ok: s => noTwoNonLettersInRow(s)},
    ],
    // 6
    [
      {id:16, text:'Длина — простое число', ok: s => isPrime(s.length)},
      {id:17, text:'Ровно две разные цифры встречаются в пароле', ok: s => twoDistinctDigits(s)},
      {id:18, text:'Подчёркиваний столько же, сколько «!»', ok: s => underscoresEqExclaims(s)},
    ],
    // 7
    [
      {id:19, text:'Если оставить только буквы — это палиндром', ok: s => palindromeLettersOnly(s)},
      {id:20, text:'Гласных столько же, сколько согласных (только буквы)', ok: s => vowelsEqConsonants(s)},
      {id:21, text:'Нет возрастающих цифровых последовательностей длиной ≥ 3 (типа 123)', ok: s => noAscendingDigitRun3Plus(s)},
    ],
    // 8 — финальная проверка формы
    [
      {id:22, text:'Минимум 6 уникальных символов', ok: s => uniqueAtLeast(s,6)},
      {id:23, text:'Присутствуют буквы, цифры и знаки (все 3 категории)', ok: s => categories3(s)},
      {id:24, text:'Начинается с буквы', ok: s => startsWithLetter(s)},
    ],
  ];

  // ===== СОСТОЯНИЕ + ТАЙМЕР/ПРОГРЕСС =====
  let state = { packIndex:0, value:'', startedAt:null, best:null };
  let timerId = null;

  function totalRules(){ return packs.reduce((a,p)=>a+p.length,0); }
  function doneRulesInPrevPacks(){ return packs.slice(0, state.packIndex).reduce((a,p)=>a+p.length,0); }

  function render(scroll){
    stagesEl.textContent = String(packs.length);
    list.innerHTML = '';
    packs[state.packIndex].forEach(r=>{
      const li = document.createElement('li'); li.className = 'bad'; li.dataset.ruleId = r.id;
      li.innerHTML = `<div>${r.text}</div>`; list.appendChild(li);
    });
    stageEl.textContent = String(state.packIndex+1);
    if(scroll) window.scrollTo({top:0,behavior:'smooth'});
    input.dispatchEvent(new Event('input'));
    save();
  }

  function startTimer(){
    if(state.startedAt) return;
    state.startedAt = Date.now();
    timerId = setInterval(updateTimer, 200);
  }
  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
  function updateTimer(){
    if(!state.startedAt){ timerEl.textContent='00:00'; return; }
    const s = Math.floor((Date.now()-state.startedAt)/1000);
    const mm = String(Math.floor(s/60)).padStart(2,'0'); const ss = String(s%60).padStart(2,'0');
    timerEl.textContent = `${mm}:${ss}`;
  }
  function updateProgress(currentOk){
    const completed = doneRulesInPrevPacks() + currentOk;
    const total = totalRules();
    const pct = Math.floor(completed*100/total);
    progbar.style.width = pct + '%'; proglbl.textContent = pct + '%';
  }
  function announce(msg){ live.textContent=''; setTimeout(()=> live.textContent = msg, 10); }

  // ===== ВАЛИДАЦИЯ =====
  input.addEventListener('input', () => {
    const s = input.value;
    state.value = s;
    if(s && !state.startedAt) startTimer();

    const lis = list.querySelectorAll('li');
    let allOk = true, okCount = 0;

    packs[state.packIndex].forEach((rule, i) => {
      let ok=false; try{ ok = !!rule.ok(s); }catch(e){ ok=false; }
      lis[i].className = ok ? 'ok' : 'bad';
      if(ok) okCount++; else allOk=false;
    });

    updateProgress(okCount);
    announce(`Выполнено правил: ${doneRulesInPrevPacks()+okCount} из ${totalRules()}`);

    if(allOk){
      if(state.packIndex < packs.length-1){
        state.packIndex++;
        render(true);
      } else {
        stopTimer();
        const elapsed = timerEl.textContent;
        done.textContent = `Готово! Время: ${elapsed}`;
        show('Победа!');
        if(!state.best || (Date.now()-state.startedAt) < state.best){
          state.best = Date.now()-state.startedAt;
          bestEl.textContent = elapsed;
          show('Новый рекорд!');
        }
        save();
      }
    } else {
      done.textContent = '';
    }
    save();
  });

  // ===== КНОПКИ =====
  toggleBtn.addEventListener('click', ()=>{
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    toggleBtn.textContent = isText ? 'Показать' : 'Скрыть';
    toggleBtn.setAttribute('aria-pressed', String(!isText));
  });

  resetBtn.addEventListener('click', ()=>{
    state.packIndex = 0; state.value=''; input.value='';
    state.startedAt = null; done.textContent='';
    render(true); updateTimer(); show('Сброс!');
  });

  window.copy = async function(){
    try{ await navigator.clipboard.writeText(input.value || ''); show('Скопировано'); }
    catch{ show('Не удалось скопировать'); }
  }
  function show(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 900); }

  // ===== АВТОСЕЙВ =====
  function save(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({
        packIndex: state.packIndex,
        value: state.value,
        startedAt: state.startedAt,
        best: state.best
      }));
    }catch{}
  }
  function load(){
    try{
      const raw = localStorage.getItem(LS_KEY); if(!raw) return;
      const obj = JSON.parse(raw);
      state.packIndex = Math.max(0, Math.min((packs.length-1), obj.packIndex||0));
      state.value = obj.value || '';
      state.startedAt = obj.startedAt || null;
      state.best = obj.best || null;
      input.value = state.value;
      if(state.best){
        const s = Math.floor(state.best/1000);
        const mm = String(Math.floor(s/60)).padStart(2,'0'); const ss = String(s%60).padStart(2,'0');
        bestEl.textContent = `${mm}:${ss}`;
      } else bestEl.textContent = '—';
    }catch{}
  }

  // INIT
  load();
  render(false);
  updateTimer();
  if(state.value) startTimer();

})();
</script>
</body>
</html>
