<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Глазяка 98</title>
<style>
  :root{ --bg:#c0c0c0; --win:#d4d0c8; --dark:#404040; --mid:#808080; --light:#fff; --text:#111; --blue:#000080; }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 "MS Sans Serif",Tahoma,Verdana,Arial,sans-serif}

  .window{max-width:760px;margin:12px auto;background:var(--win);
    border:2px solid var(--dark);border-right-color:var(--light);border-bottom-color:var(--light);box-shadow:0 0 0 1px var(--mid) inset}
  .title{padding:3px 6px;color:#fff;background:linear-gradient(#000080,#1084d0);display:flex;justify-content:space-between;align-items:center}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px;border-top:1px solid var(--light);border-bottom:1px solid var(--mid);background:linear-gradient(#efefef,#e3e3e3)}
  .bar label{display:flex;align-items:center;gap:6px;padding:2px 6px;background:#fff;border:1px solid var(--mid)}
  .stage{position:relative;margin:8px;border:2px solid var(--dark);border-right-color:var(--light);border-bottom-color:var(--light);
    background:#f3f1ec;height:480px;display:grid;place-items:center;overflow:hidden}

  /* глаз */
  .eye{position:relative;width:240px;height:240px;border-radius:50%;background:#fff;border:2px solid #000;
       box-shadow:inset 0 0 0 18px #e8e8e8, 0 4px 0 #00000010}
  .iris{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;
        background:radial-gradient(circle at 50% 50%, #4b7abf 0%, #1f4a86 55%, #0b1e3d 100%);
        filter:saturate(.9)}
  .pupil{position:absolute;left:50%;top:50%;width:70px;height:70px;margin-left:-35px;margin-top:-35px;border-radius:50%;
         background:#111;box-shadow:inset 0 0 0 12px #2e2e2e}
  .shine{position:absolute;left:50%;top:50%;width:16px;height:16px;margin-left:-24px;margin-top:-18px;border-radius:50%;background:#fff;opacity:.85}
  .shadow{position:absolute;left:50%;top:50%;width:90px;height:90px;margin-left:-45px;margin-top:-45px;border-radius:50%;
          background:radial-gradient(circle at 30% 30%, #00000040 0%, #0000 70%);mix-blend-mode:multiply;pointer-events:none}

  /* веки */
  .lid-top,.lid-bot{position:absolute;left:0;right:0;height:62px;background:#f3f1ec;border:2px solid #000;border-left:none;border-right:none;pointer-events:none;transition:transform .14s}
  .lid-top{top:-2px;border-bottom-width:2px;transform:translateY(-64px)}
  .lid-bot{bottom:-2px;border-top-width:2px;transform:translateY(64px)}
  .blink .lid-top{transform:translateY(0)}
  .blink .lid-bot{transform:translateY(0)}
  .squint .lid-top{transform:translateY(-12px)}
  .squint .lid-bot{transform:translateY(12px)}

  .hint{position:absolute;top:6px;left:8px;color:#333}

  /* слеза */
  .tear{position:absolute;left:50%;top:58%;width:12px;height:12px;margin:-6px 0 0 -6px;background:radial-gradient(circle at 30% 30%, #9ad1ff 0%, #3aa0e9 60%, #1e74b9 100%);border-radius:50%;
        box-shadow:0 0 6px #3aa0e988}

  /* тост */
  .toast{position:absolute;right:8px;top:8px;background:#fff;border:1px solid var(--mid);padding:4px 6px;opacity:0;transition:.2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div class="window">
    <div class="title"><b>Глазяка — следит за курсором</b><span style="opacity:.8;font-weight:400">Retro ’98</span></div>

    <div class="bar" id="bar">
      <label><input id="cbSacc" type="checkbox" checked> Микросаккады</label>
      <label><input id="cbDil"  type="checkbox" checked> Дилатация</label>
      <label><input id="cbShy"  type="checkbox" checked> Застенчивость</label>
      <button id="btnCenter" class="btn">В центр</button>
      <style>.btn{padding:4px 10px;background:#e9e6df;border:2px solid var(--light);border-right-color:var(--dark);border-bottom-color:var(--dark);cursor:pointer}
      .btn:active{border:2px solid var(--dark);border-right-color:var(--light);border-bottom-color:var(--light)}</style>
    </div>

    <div class="stage" id="stage" aria-label="Глаз следит за курсором">
      <div class="hint">Двигай курсор. Замрёшь — моргнёт. Пики — прищур. Очень много пиков — слеза.</div>
      <div class="eye" id="eye">
        <div class="iris" id="iris"></div>
        <div class="pupil" id="pupil"><div class="shine"></div></div>
        <div class="shadow" id="shadow"></div>
        <div class="lid-top" id="lidTop"></div>
        <div class="lid-bot" id="lidBot"></div>
      </div>
      <div id="toast" class="toast">Привет!</div>
    </div>
  </div>

<script>
(function(){
  const stage  = document.getElementById('stage');
  const eye    = document.getElementById('eye');
  const iris   = document.getElementById('iris');
  const pupil  = document.getElementById('pupil');
  const shadow = document.getElementById('shadow');
  const lidTop = document.getElementById('lidTop');
  const lidBot = document.getElementById('lidBot');
  const toast  = document.getElementById('toast');

  const cbSacc = document.getElementById('cbSacc');
  const cbDil  = document.getElementById('cbDil');
  const cbShy  = document.getElementById('cbShy');
  const btnCenter = document.getElementById('btnCenter');

  const LS_KEY = 'glazyaka98_cfg_v1';

  // геометрия
  let E = {cx:0, cy:0, rEye:0, rMove:0, rPupil:35}; // rMove = радиус, в котором может гулять центр зрачка
  let mouse = {x: window.innerWidth/2, y: window.innerHeight/2, vx:0, vy:0, speed:0};
  let target = {x:0, y:0};  // целевая позиция зрачка (относительно центра глаза)
  let current = {x:0, y:0, s:1}; // фактическая позиция + масштаб
  let lastMoveTs = performance.now();
  let idleBlinkTimer = null;
  let saccTimer = null;
  let pokes = 0;

  // инициализация
  recalc();
  placeCenter();
  loadCfg();
  startLoop();
  scheduleBlink();
  scheduleSaccades();

  // слежение за указателем
  window.addEventListener('pointermove', (e)=>{
    const t = performance.now();
    const dt = Math.max(1, (t - lastMoveTs));
    const nx = e.clientX, ny = e.clientY;
    mouse.vx = (nx - mouse.x) / dt;
    mouse.vy = (ny - mouse.y) / dt;
    mouse.speed = Math.hypot(mouse.vx, mouse.vy) * 16; // масштаб для ощущения
    mouse.x = nx; mouse.y = ny;
    lastMoveTs = t;

    computeTarget(); // обновим target

    eye.classList.remove('blink');
    clearTimeout(idleBlinkTimer);
    idleBlinkTimer = setTimeout(()=> blink(), 1400);
  }, {passive:true});

  // «пик» по глазу — прищур и счётчик
  eye.addEventListener('pointerdown', ()=>{
    squint(220);
    pokes++;
    if(pokes===3) show('Ай-ай!');
    if(pokes===8) { tear(); show('Ну всё, обиделся.'); pokes=0; }
  });

  // кнопки/тогглы
  cbSacc.addEventListener('change', saveCfg);
  cbDil.addEventListener('change', saveCfg);
  cbShy.addEventListener('change', saveCfg);
  btnCenter.addEventListener('click', placeCenter);

  window.addEventListener('resize', ()=>{ recalc(); });

  // ====== ФУНКЦИИ ======

  function recalc(){
    const r = eye.getBoundingClientRect();
    E.cx = r.left + r.width/2;
    E.cy = r.top  + r.height/2;
    E.rEye = Math.min(r.width, r.height)/2 - 4;
    E.rMove = Math.min(80, E.rEye - E.rPupil*0.6); // безопасный радиус для центра зрачка
  }

  function placeCenter(){
    const W = stage.clientWidth, H = stage.clientHeight;
    const dx = (stage.getBoundingClientRect().left);
    const dy = (stage.getBoundingClientRect().top);
    // просто заставим глаз выполнить одну итерацию к центру экрана
    mouse.x = dx + W/2; mouse.y = dy + H/2;
    computeTarget();
    current.x = target.x; current.y = target.y; current.s = 1;
    applyTransform();
  }

  function computeTarget(){
    // вектор от центра глаза до курсора
    const dx = mouse.x - E.cx;
    const dy = mouse.y - E.cy;
    const d  = Math.hypot(dx,dy) || 1;

    // «застенчивость»: если курсор слишком близко — смотрим в противоположную сторону
    const shy = cbShy.checked && d < 80;
    const dirX = shy ? -dx : dx;
    const dirY = shy ? -dy : dy;

    // ограничиваем движение внутри rMove
    const k = Math.min(1, E.rMove / (Math.hypot(dirX,dirY)||1));
    target.x = dirX * k;
    target.y = dirY * k;
  }

  function startLoop(){
    (function loop(){
      // плавное приближение (инерция)
      const ease = 0.14;
      current.x += (target.x - current.x) * ease;
      current.y += (target.y - current.y) * ease;

      // дилатация зрачка
      let s = 1;
      if(cbDil.checked){
        // ближе и быстрее — чуть больше зрачок
        const dist = Math.min(1, Math.hypot(mouse.x - E.cx, mouse.y - E.cy) / (E.rEye*1.2));
        const sp   = Math.min(1, mouse.speed / 1.5);
        s = 0.9 + dist*0.12 + sp*0.10; // 0.9..1.12
      }
      current.s += (s - current.s) * 0.12;

      applyTransform();
      requestAnimationFrame(loop);
    })();
  }

  function applyTransform(){
    // двигаем iris/pupil/shadow в одном векторе, но shadow чуть отстаёт (псевдо-параллакс)
    iris.style.transform   = `translate(${current.x*0.6}px, ${current.y*0.6}px)`;
    pupil.style.transform  = `translate(${current.x}px, ${current.y}px) scale(${current.s})`;
    shadow.style.transform = `translate(${current.x*0.35}px, ${current.y*0.35}px)`;
  }

  function blink(){
    eye.classList.add('blink');
    setTimeout(()=> eye.classList.remove('blink'), 160);
  }
  function scheduleBlink(){
    clearTimeout(idleBlinkTimer);
    idleBlinkTimer = setTimeout(()=>{ blink(); scheduleBlink(); }, 2600 + Math.random()*1800);
  }

  function squint(ms=200){
    eye.classList.add('squint');
    setTimeout(()=> eye.classList.remove('squint'), ms);
  }

  function tear(){
    const t = document.createElement('div');
    t.className='tear';
    eye.appendChild(t);
    let y=0, vy=1.2;
    const drop = ()=>{
      y += vy; vy += 0.12;
      t.style.transform = `translate(0, ${y}px)`;
      if(y < 180) requestAnimationFrame(drop);
      else t.remove();
    };
    requestAnimationFrame(drop);
  }

  // микросаккады — мелкая дрожь взгляда
  function scheduleSaccades(){
    clearTimeout(saccTimer);
    if(!cbSacc.checked){ saccTimer = setTimeout(scheduleSaccades, 1200); return; }
    saccTimer = setTimeout(()=>{
      // короткий импульс крошечного движения цели
      const amp = 6 + Math.random()*6;
      const ang = Math.random()*Math.PI*2;
      target.x += Math.cos(ang)*amp;
      target.y += Math.sin(ang)*amp;
      // не выходим за радиус
      const len = Math.hypot(target.x, target.y);
      if(len > E.rMove){ target.x *= E.rMove/len; target.y *= E.rMove/len; }
      scheduleSaccades();
    }, 900 + Math.random()*1600);
  }

  function show(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1200);
  }

  // сохранение настроек
  function saveCfg(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({
        sacc: cbSacc.checked,
        dil:  cbDil.checked,
        shy:  cbShy.checked
      }));
    }catch{}
    scheduleSaccades();
  }
  function loadCfg(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(!raw) return;
      const cfg = JSON.parse(raw);
      if(typeof cfg.sacc==='boolean') cbSacc.checked = cfg.sacc;
      if(typeof cfg.dil ==='boolean') cbDil.checked  = cfg.dil;
      if(typeof cfg.shy ==='boolean') cbShy.checked  = cfg.shy;
    }catch{}
  }

  // стартовая позиция — пусть посмотрит в центр окна
  computeTarget(); applyTransform();

})();
</script>
</body>
</html>
